<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDNIGHT · Atividades</title>
  <style>
    :root {
      --panel: #0f1420;
      --panel2: #111828;
      --border: #252d42;
      --border2: #1a2032;
      --gold: #c9a84c;
      --gold2: #e4c76a;
      --text: #d4ddf0;
      --muted: #8a94a8;
      --muted2: #5a6480;
      --green: #4ecb8e;
      --amber: #f5a623;
      --red: #e05a5a;
      --accent: #7c6cff;
      --blue: #4f7dd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--panel2);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-family: Georgia, serif;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: .5px;
    }
    .brand p { font-size: 11px; color: var(--muted); }
    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    nav a:hover { filter: brightness(1.2); color: var(--text); }
    nav a.active {
      background: var(--gold);
      color: #0b0f18;
      border-color: var(--gold);
    }
    .main-wrap {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
    }
    #atividades-root {
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 22px;">🌙</span>
      <div>
        <h1>MIDNIGHT</h1>
        <p>Warband & Economy Web App</p>
      </div>
    </div>
    <nav>
      <a href="index.html">Hub</a>
      <a href="atividades.html" class="active">Atividades</a>
      <a href="profissoes.html">Profissões</a>
      <a href="metas.html">Metas</a>
      <a href="perfil.html">Perfil</a>
      <a href="economia.html">Economia</a>
    </nav>
  </header>

  <div class="main-wrap">
    <div id="atividades-root"></div>
  </div>

  <script>
    // --- ADAPTADOR DO OBSIDIAN (FALSO) ---
    const app = {
      vault: {
        adapter: {
          exists: async (path) => localStorage.getItem("MDN_" + path) !== null,
          read: async (path) => localStorage.getItem("MDN_" + path) || "{}",
          write: async (path, data) => localStorage.setItem("MDN_" + path, data),
          list: async (folder) => ({ files: [] }),
          remove: async (path) => localStorage.removeItem("MDN_" + path)
        },
        getAbstractFileByPath: (path) => null
      }
    };
    const dv = { current: () => ({ file: { folder: "" } }) };

    document.addEventListener("DOMContentLoaded", async () => {
      dv.container = document.getElementById("atividades-root");
      const CROOT = dv.container;
      const _adapter = app.vault.adapter, _folder = dv.current().file.folder;
      const _SPATH = (_folder?_folder+"/":"") + "MIDNIGHT_Atividades_Data.json";
      const _TABS = [["leveling", "⚔️ Leveling"], ["log", "🕒 Log Diário"], ["main", "🎮 Main"], ["pesca", "🎣 Pesca"]];
      const _HOOK = {"leveling": "__mtFocus", "log": "__lgFocus", "main": "__mnFocus", "pesca": "__pkFocus"};
      let _active = "leveling";
      
      try { 
        if(await _adapter.exists(_SPATH)){ 
          const p = JSON.parse(await _adapter.read(_SPATH)); 
          if(p && p.active) _active = p.active; 
        } 
      } catch(e) {}

      CROOT.innerHTML=`<style>
      .atbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
      .atbar .attab{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;transition:0.15s;}
      .atbar .attab:hover{filter:brightness(1.15)}
      .atbar .attab.on{background:var(--gold);color:#0b0f18;border-color:var(--gold)}
      </style>
      <div class="atbar" id="_atbar"></div>
      <div data-sec="leveling"></div><div data-sec="log"></div><div data-sec="main"></div><div data-sec="pesca"></div>`;

      function _apply() { 
        CROOT.querySelectorAll("[data-sec]").forEach(el => { el.style.display = (el.dataset.sec === _active) ? "" : "none"; }); 
        CROOT.querySelectorAll(".attab").forEach(b => b.classList.toggle("on", b.dataset.t === _active)); 
      }
      function _redraw(){ const h = window[_HOOK[_active]]; if(typeof h === "function"){ try{ h(); }catch(e){} } }

      CROOT.querySelector("#_atbar").innerHTML = _TABS.map(t => '<button class="attab" data-t="'+t[0]+'">'+t[1]+'</button>').join("");
      CROOT.querySelectorAll(".attab").forEach(b => b.onclick = async () => { 
        _active = b.dataset.t; 
        await _ensure(_active); 
        _apply(); 
        setTimeout(_redraw, 60); 
        try { await _adapter.write(_SPATH, JSON.stringify({active:_active})); } catch(e){} 
      });

      /* ================= MIDNIGHT · Leveling ================= */
      async function run_leveling(root){
        const folder = dv.current().file.folder;
        const DATA_PATH = (folder ? folder + "/" : "") + "MIDNIGHT_Leveling_Data.json";
        const adapter = app.vault.adapter;

         ["Pyrogalth",90,"Bruxo","Azralon H"],["Ngmmexe",90,"Druida","Nêmesis A"],["Rootmexe",90,"Druida","Azralon H"],["Redfoxzito",90,"Sacerdote","Azralon H"],["Veltharys",90,"Death Knight","Azralon H"],["Ngmmexedk",90,"Death Knight","Nêmesis A"],["Ngmmexee",90,"Monge","Azralon H"],["Bixúvéi",90,"Rogue","Azralon H"],["Roguemexe",90,"Rogue","Nêmesis A"],["Gnomexe",90,"Guerreiro","Nêmesis A"],["Magemexe",90,"Mago","Azralon A"],["Beastmexe",90,"Caçador","Azralon H"],["Vhaelor",90,"Demon Hunter","Nêmesis A"],

["Strongroot",82,"Druida","Mal'Ganis H"],["Rokhgaro",82,"Druida","Tichondrius H"],["Eldrico",82,"Druida","Frostmourne A"],["Druidmexe",82,"Druida","Dalaran A"]
        ];
        let ROSTER = ROSTER_FALLBACK;
        let TOTAL = ROSTER.length;
        const CUTOFF = new Date(2026,8,22,23,59,59);
        const RATE_BEFORE = 4, RATE_AFTER = 2;
        const LONG_RUN_MS = 8.5*3600*1000;
        const CLASS_COLOR = {"Bruxo":"#8788EE","Druida":"#FF7C0A","Sacerdote":"#EAEAEA","Death Knight":"#C41E3A","Monge":"#00FF98","Rogue":"#FFF468","Guerreiro":"#C69B6D","Mago":"#3FC7EB","Caçador":"#AAD372","Demon Hunter":"#A330C9","Xamã":"#0070DD","Paladino":"#F48CBA","Evoker":"#33937F"};
        const SERVER_ORDER = ["Azralon H","Azralon A","Nêmesis A","Thrall (NA)","Area 52 (NA)","Illidan (NA)","Proudmoore (NA)","Moon Guard (NA)","Stormrage (NA)","Hyjal (NA)","Sargeras (NA)","Zul'jin (NA)","Wyrmrest (NA)","Mal'Ganis H","Tichondrius H","Frostmourne A","Dalaran A"];

        function freshState(){
          return { chars: ROSTER.map((r,i)=>({id:i,name:r[0],level:r[1],cls:r[2],server:r[3],done:r[1]>=90,doneAt:null})),
                   timer:{running:false,currentId:null,startedAt:null,accumulated:0}, sessions:[], customGoals:[], gran:"week" };
        }
        async function loadState(){
          try{
            if(await adapter.exists(DATA_PATH)){
              const p = JSON.parse(await adapter.read(DATA_PATH));
              const base = freshState();
              if(Array.isArray(p.chars)) base.chars.forEach(c=>{ const m=p.chars.find(x=>x.name===c.name); if(m){c.done=!!m.done;c.doneAt=m.doneAt||null;} });
              base.timer = Object.assign(base.timer, p.timer||{});
              base.sessions = Array.isArray(p.sessions)? p.sessions : [];
              base.customGoals = Array.isArray(p.customGoals)? p.customGoals : [];
              base.gran = (typeof p.gran==="string") ? p.gran : "week";
              return base;
            }
          }catch(e){}
          return freshState();
        }
        let saving=false, pending=false;
        async function saveState(){
          if(saving){ pending=true; return; }
          saving=true;
          try{ await adapter.write(DATA_PATH, JSON.stringify(S)); }catch(e){}
          saving=false;
          if(pending){ pending=false; saveState(); }
        }

        let S = await loadState();

        const $ = s=>root.querySelector(s);
        const pad=n=>String(n).padStart(2,"0");
        function fmt(ms){const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);}
        function fmtHuman(ms){const t=Math.floor(ms/60000),h=Math.floor(t/60),m=t%60;return h>0?h+"h"+(m?" "+m+"min":""):m+"min";}
        function parseHMS(s){ s=(s||"").trim(); if(!s)return 0; if(s.includes(":")){ const p=s.split(":").map(n=>parseInt(n,10)||0); let h=0,m=0,sec=0; if(p.length===2){h=p[0];m=p[1];}else if(p.length>=3){h=p[0];m=p[1];sec=p[2];}else{m=p[0];} return ((h*3600)+(m*60)+sec)*1000; } const mins=parseFloat(s.replace(",",".")); return Math.round(mins*60000); }
        const RESET_DOW=2, RESET_HOUR=12; 
        function cycleStart(d){ const t=new Date(d); t.setHours(RESET_HOUR,0,0,0); const diff=((t.getDay()-RESET_DOW)+7)%7; t.setDate(t.getDate()-diff); if(t>d) t.setDate(t.getDate()-7); return t; }
        function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
        function dmy(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
        function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
        function parseDay(s){const p=String(s||"").split("-").map(n=>parseInt(n,10));return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1,23,59,59);}
        function parseDay0(s){const p=String(s||"").split("-").map(n=>parseInt(n,10));return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1,0,0,0);}
        function todayYMD(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
        const CG_COLORS=["#e05a5a","#4f7dd6","#33937F","#d64f7d","#f5a623","#00AEEF"];
        function hexA(h,a){ h=(h||"#e05a5a").replace("#",""); if(h.length===3)h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16)||0; return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
        function dm(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1);}
        function targetForWeek(mon){return mon<=CUTOFF?RATE_BEFORE:RATE_AFTER;}
        function doneCount(){return S.chars.filter(c=>c.done).length;}
        function inWeek(ts,mon){if(!ts)return false;const d=new Date(ts);return d>=mon&&d<addDays(mon,7);}
        
        const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
        const GRAN={day:{past:14,max:62,label:"Dia"},week:{past:6,max:30,label:"Semana"},month:{past:6,max:36,label:"Mês"},quarter:{past:4,max:24,label:"Trimestre"},semester:{past:3,max:16,label:"Semestre"},year:{past:2,max:12,label:"Ano"}};
        function bStart(d,g){ const x=new Date(d); x.setHours(0,0,0,0); if(g==="day")return x; if(g==="week")return cycleStart(d); if(g==="month"){x.setDate(1);return x;} if(g==="quarter"){x.setMonth(x.getMonth()-(x.getMonth()%3),1);return x;} if(g==="semester"){x.setMonth(x.getMonth()<6?0:6,1);return x;} if(g==="year"){x.setMonth(0,1);return x;} return cycleStart(d); }
        function bNext(d,g){ const x=new Date(d); x.setHours(0,0,0,0); if(g==="day"){x.setDate(x.getDate()+1);return x;} if(g==="week")return addDays(cycleStart(d),7); if(g==="month"){x.setMonth(x.getMonth()+1,1);return x;} if(g==="quarter"){x.setMonth(x.getMonth()+3,1);return x;} if(g==="semester"){x.setMonth(x.getMonth()+6,1);return x;} if(g==="year"){x.setFullYear(x.getFullYear()+1,0,1);return x;} return addDays(cycleStart(d),7); }
        function bLabel(d,g){ if(g==="day"||g==="week")return dm(d); if(g==="month")return MESES[d.getMonth()]+"/"+String(d.getFullYear()).slice(2); if(g==="quarter")return "T"+(Math.floor(d.getMonth()/3)+1)+"/"+String(d.getFullYear()).slice(2); if(g==="semester")return "S"+(d.getMonth()<6?1:2)+"/"+String(d.getFullYear()).slice(2); if(g==="year")return String(d.getFullYear()); return dm(d); }
        function dailyMetaRate(d){ return targetForWeek(cycleStart(d))/7; }
        function metaCumAt(endDate){ let d=new Date(); d.setHours(12,0,0,0); let c=doneCount(); let guard=0; const endT=endDate.getTime(); while(d.getTime()<endT && c<TOTAL && guard<2500){ c+=dailyMetaRate(d); d=addDays(d,1); guard++; } return Math.min(TOTAL,c); }

        root.innerHTML = `<style>

        .mtxL .stat .n{font-family:Georgia,serif;font-size:22px;font-weight:bold;color:var(--gold)}

      async function run_log(root){
        const folder = dv.current().file.folder;
        const DATA_PATH = (folder ? folder + "/" : "") + "MIDNIGHT_Log_Data.json";
        const adapter = app.vault.adapter;
        const TOTAL = 70;                 
        const RESET_DOW = 2;              
        const RESET_HOUR = 12;            
        const LONG_RUN_MS = 8.5*3600*1000; 
        const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
        const DOW = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
        const DOWFULL = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

        function freshState(){ return { timer:{running:false,startedAt:null,accumulated:0}, entries:[], goalVoltas:1 }; }
        async function loadState(){
          try{ if(await adapter.exists(DATA_PATH)){ const p=JSON.parse(await adapter.read(DATA_PATH)); const b=freshState();
            b.timer=Object.assign(b.timer,p.timer||{}); b.entries=Array.isArray(p.entries)?p.entries:[]; b.goalVoltas=(p.goalVoltas&&p.goalVoltas>=1)?p.goalVoltas:1; return b; } }
          catch(e){}
          return freshState();
        }
        let saving=false,pending=false;
        async function saveState(){ if(saving){pending=true;return;} saving=true;
          try{ await adapter.write(DATA_PATH, JSON.stringify(S)); }catch(e){}
          saving=false; if(pending){pending=false;saveState();} }
        let S = await loadState();

        const $=s=>root.querySelector(s);
        const pad=n=>String(n).padStart(2,"0");
        function fmt(ms){const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);}
        function fmtHuman(ms){const t=Math.floor(ms/60000),h=Math.floor(t/60),m=t%60;return h>0?h+"h"+(m?" "+pad(m):""):m+"min";}
        function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
        function dmy(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
        function dm(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1);}
        function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}

        function renderChart(){

          for(let i=N-1;i>=0;i--){ const d=addDays(base,-i); const k=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); days.push({d,k,v:day[k]?day[k]:null}); }
          const maxMs=Math.max(1,...days.map(x=>x.v?x.v.ms:0));

          const padL=42,padR=12,padT=12,padB=34, plotW=W-padL-padR, plotH=H-padT-padB;

          const bw=plotW/N, cs=cycleStart(new Date()).getTime();

            if(x.v){

                ctx.fillStyle=c.color; ctx.fillRect(bx,y,w,h); acc+=val; }); }

            if(cycleStart(x.d).getTime()===cycleStart(x.d).getTime() && x.d.getDay()===2){ ctx.strokeStyle="rgba(245,166,35,.35)"; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(bx-bw*0.15,padT); ctx.lineTo(bx-bw*0.15,padT+plotH); ctx.stroke(); ctx.setLineDash([]); }

            b.timer=Object.assign(b.timer,p.timer||{}); b.sessions=Array.isArray(p.sessions)?p.sessions:[]; return b; } }
          catch(e){}

        function fmtHuman(ms){const t=Math.floor(ms/60000),h=Math.floor(t/60),m=t%60;return h>0?h+"h"+(m?" "+pad(m):""):m+"min";}
        function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}

        function parseHMS(s){ s=(s||"").trim(); if(!s)return 0; if(s.includes(":")){ const p=s.split(":").map(n=>parseInt(n,10)||0); let h=0,m=0,sec=0; if(p.length===2){h=p[0];m=p[1];}else if(p.length>=3){h=p[0];m=p[1];sec=p[2];}else{m=p[0];} return ((h*3600)+(m*60)+sec)*1000; } const mins=parseFloat(s.replace(",",".")); return Math.round(mins*60000); }
        function cycleStart(d){ const t=new Date(d); t.setHours(RESET_HOUR,0,0,0); const diff=((t.getDay()-RESET_DOW)+7)%7; t.setDate(t.getDate()-diff); if(t>d) t.setDate(t.getDate()-7); return t; }

        .mtxK .cw{width:100%;max-width:100%;overflow-x:auto}
        .mtxK canvas{display:block}
        .mtxK .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .mtxK .cal-head .mname{font-family:Georgia,serif;font-size:15px;color:var(--gold)}
        .mtxK .cal-head button{flex:0 0 auto;min-width:0;padding:6px 13px;background:var(--panel2);color:var(--text);border:1px solid var(--border);font-size:14px}
        .mtxK .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
        .mtxK .cal-dow{font-size:10px;color:var(--muted2);text-align:center;text-transform:uppercase;padding-bottom:2px}
        .mtxK .cal-cell{min-height:54px;border:1px solid var(--border2);border-radius:8px;padding:5px 6px;display:flex;flex-direction:column;cursor:pointer;min-width:0;overflow:hidden;background:var(--panel)}
        .mtxK .cal-cell:hover{border-color:var(--muted2)}
        .mtxK .cal-cell.empty{border:none;background:none;cursor:default}
        .mtxK .cal-cell.today{box-shadow:0 0 0 1px var(--gold) inset}
        .mtxK .cal-cell .d{font-size:11px;font-weight:600;color:var(--text)}
        .mtxK .cal-cell .b{margin-top:auto;font-size:9.5px;line-height:1.3;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mtxK table{width:100%;border-collapse:collapse;font-size:12.5px}
        .mtxK th{text-align:left;color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border-bottom:1px solid var(--border)}
        .mtxK td{padding:6px 9px;border-bottom:1px solid var(--border2);vertical-align:middle}
        .mtxK .semp{color:var(--muted2);font-size:12.5px;text-align:center;padding:18px 0}
        .mtxK .ico{color:var(--muted2);cursor:pointer;font-size:13px;margin-left:8px}
        .mtxK .ico:hover{color:var(--gold)}
        .mtxK .ico.del:hover{color:var(--red)}
        .mtxK .sscroll{max-height:320px;overflow-y:auto}
        .mtxK .ftr{text-align:center;color:var(--muted2);font-size:11px;margin-top:8px}
        @media (max-width:560px){.mtxK .stats{grid-template-columns:repeat(2,1fr)}}
        </style>
        <div class="mtxK">
          <div class="stats">
            <div class="stat"><div class="n" id="pesca-s-total">0h</div><div class="l">Tempo total</div></div>
            <div class="stat"><div class="n" id="pesca-s-month">0h</div><div class="l">Este mês</div></div>
            <div class="stat"><div class="n" id="pesca-s-cycle">0h</div><div class="l">Este ciclo</div></div>
            <div class="stat"><div class="n" id="s-avg">—</div><div class="l">Média/sessão</div></div>
          </div>
          <div class="grid" style="margin-top:20px">
            <div class="row">
              <div class="card col tcard" style="flex:1.1">
                <h2 class="mt">🎣 Cronômetro de pesca</h2>
                <div class="warn-box" id="pk-warn" style="display:none"></div>
                <div class="tdisp" id="pk-timer">00:00:00</div>
                <div class="tsub" id="pk-sub">Rode enquanto pesca</div>
                <div class="ctrls">
                  <button class="start" id="pk-start">▶ Iniciar</button>
                  <button class="stop" id="pk-stop" disabled>■ Encerrar → registro</button>
                  <button class="ghost" id="pk-reset" title="Zerar">↺</button>
                </div>
              </div>
              <div class="card col">
                <h2 class="mt">📝 Registrar sessão</h2>
                <label class="sl">Data</label>
                <input type="date" id="pk-date">
                <label class="sl">Personagem (opcional)</label>
                <input type="text" id="pk-char" placeholder="ex.: Rootmexe" list="pk-chars">
                <datalist id="pk-chars"></datalist>
                <label class="sl">Tempo (hh:mm ou minutos)</label>
                <input type="text" id="pk-time" placeholder="ex.: 1:20 ou 80">
                <label class="sl">Nota (opcional)</label>
                <input type="text" id="pk-note" placeholder="ex.: hora do sonho, evento X">
                <button class="add" id="pk-add">➕ Adicionar sessão</button>
              </div>
            </div>
            <div class="card">
              <h2 class="mt">🐟 Tempo por personagem</h2>
              <div class="ctrls" style="margin:0 0 14px">
                <button class="mini ghost" id="d-all">Tudo</button>
                <button class="mini ghost" id="d-month">Este mês</button>
                <button class="mini ghost" id="d-cycle">Este ciclo</button>
              </div>
              <div class="catbars" id="pesca-dist"></div>
              <div class="semp" id="dist-empty">Nenhuma sessão ainda.</div>
            </div>
            <div class="card">
              <h2 class="mt">📈 Tendência (tempo por dia — 28 dias)</h2>
              <div class="cw"><canvas id="pk-chart" height="240"></canvas></div>
            </div>
            <div class="card">
              <h2 class="mt">📅 Calendário</h2>
              <div class="cal-head"><button id="pesca-cal-prev">‹</button><span class="mname" id="pesca-cal-name"></span><button id="pesca-cal-next">›</button></div>
              <div class="cal-grid" id="pesca-cal-dows"></div>
              <div class="cal-grid" id="pesca-cal-grid" style="margin-top:6px"></div>
              <div class="gmeta" id="pesca-cal-sum" style="margin-top:10px"></div>
            </div>
            <div class="card">
              <h2 class="mt">📚 Histórico</h2>
              <div class="sscroll"><table><thead><tr><th>Data</th><th>Personagem</th><th style="text-align:right">Tempo</th><th style="text-align:right;width:70px">Ações</th></tr></thead><tbody id="pesca-h-body"></tbody></table>
              <div class="semp" id="pesca-h-empty">Nenhuma sessão registrada ainda.</div></div>
            </div>
          </div>
          <div class="ftr">Dados salvos no cache do navegador · <button class="lnk" id="pk-wipe">apagar tudo</button></div>
        </div>`;

        let toastT=null;
        function toast(m){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";root.querySelector(".mtxK").appendChild(t);} t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

        function elapsed(){ let e=S.timer.accumulated||0; if(S.timer.running&&S.timer.startedAt)e+=Date.now()-S.timer.startedAt; return e; }
        function renderTimer(){ const el=$("#pk-timer"); if(!el||!document.body.contains(el)){ if(window.__pkTick){clearInterval(window.__pkTick);window.__pkTick=null;} return; }
          const e=elapsed(); el.textContent=fmt(e); el.classList.toggle("run",S.timer.running);
          const sub=$("#pk-sub"), warn=$("#pk-warn");
          if(S.timer.running){ const since=new Date(S.timer.startedAt); sub.innerHTML="🔴 Pescando — iniciado às "+pad(since.getHours())+":"+pad(since.getMinutes()); }
          else if(e>0) sub.innerHTML="⏸ Pausado — "+fmtHuman(e); else sub.textContent="Rode enquanto pesca";
          if(S.timer.running && e>LONG_RUN_MS){ warn.style.display="block"; warn.innerHTML="⚠️ Cronômetro rodando há "+fmtHuman(e)+". Esqueceu de encerrar?"; } else warn.style.display="none";
          const b=$("#pk-start"); b.textContent=S.timer.running?"⏸ Pausar":(e>0?"▶ Retomar":"▶ Iniciar"); b.className=S.timer.running?"pause":"start";
          $("#pk-stop").disabled=e<=0; }
        async function startPause(){ if(!S.timer.running){ S.timer.running=true; S.timer.startedAt=Date.now(); startTick(); } else { S.timer.accumulated=elapsed(); S.timer.running=false; S.timer.startedAt=null; stopTick(); } await saveState(); renderTimer(); }
        async function stopToForm(){ const e=elapsed(); if(e<1000){toast("Tempo muito curto");return;}
          $("#pk-time").value=fmt(e); $("#pk-date").value=$("#pk-date").value||todayStr();
          S.timer={running:false,startedAt:null,accumulated:0}; stopTick(); await saveState(); renderTimer();
          toast("Tempo enviado ao registro ↓ informe o personagem"); const c=$("#pk-char"); if(c)c.focus(); }
        async function resetTimer(){ S.timer={running:false,startedAt:null,accumulated:0}; stopTick(); await saveState(); renderTimer(); }
        function startTick(){ if(window.__pkTick)clearInterval(window.__pkTick); window.__pkTick=setInterval(renderTimer,1000); }
        function stopTick(){ if(window.__pkTick){clearInterval(window.__pkTick);window.__pkTick=null;} }

        async function addSession(){
          const date=$("#pk-date").value||todayStr();
          const ms=parseHMS($("#pk-time").value);
          const char=($("#pk-char").value||"").trim();
          const note=($("#pk-note").value||"").trim();
          if(ms<=0){ toast("Informe o tempo"); return; }
          S.sessions.push({id:Date.now(),date,durationMs:ms,char,note});
          await saveState(); $("#pk-time").value=""; $("#pk-note").value=""; renderAll();
          toast("Sessão de pesca salva: "+fmtHuman(ms)+(char?" · "+char:""));
        }

        function renderStats(){
          const tot=totalMs(), n=S.sessions.length;
          $("#pesca-s-total").textContent=fmtHuman(tot);
          const now=new Date(), ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
          $("#pesca-s-month").textContent=fmtHuman(S.sessions.filter(s=>s.date.startsWith(ym)).reduce((a,s)=>a+s.durationMs,0));
          const cs=cycleStart(now).getTime();
          $("#pesca-s-cycle").textContent=fmtHuman(S.sessions.filter(s=>cycleKey(parseDate(s.date))===cs).reduce((a,s)=>a+s.durationMs,0));
          $("#s-avg").textContent=n?fmtHuman(tot/n):"—";
          const names=[...new Set(S.sessions.map(s=>(s.char||"").trim()).filter(Boolean))].sort();
          const dl=$("#pk-chars"); if(dl) dl.innerHTML=names.map(n=>'<option value="'+n.replace(/"/g,"&quot;")+'">').join("");
        }

        let distMode="all";
        function renderDist(){
          const now=new Date(), ym=now.getFullYear()+"-"+pad(now.getMonth()+1), cs=cycleStart(now).getTime();
          const f= distMode==="month"?(s=>s.date.startsWith(ym)): distMode==="cycle"?(s=>cycleKey(parseDate(s.date))===cs):null;
          const agg=aggByChar(f), keys=Object.keys(agg).sort((a,b)=>agg[b]-agg[a]);
          const tot=keys.reduce((a,k)=>a+agg[k],0);
          ["d-all","d-month","d-cycle"].forEach(id=>$("#"+id).classList.add("ghost"));
          const act={all:"#d-all",month:"#d-month",cycle:"#d-cycle"}[distMode]; if($(act))$(act).classList.remove("ghost");
          const box=$("#pesca-dist"), empty=$("#dist-empty");
          if(!keys.length){ box.innerHTML=""; empty.style.display="block"; return; }
          empty.style.display="none";
          box.innerHTML=keys.map(k=>{ const v=agg[k], pct=tot?Math.round(v/tot*100):0;
            return '<div class="catrow"><span class="cname" title="'+k.replace(/"/g,"&quot;")+'">'+k.replace(/</g,"&lt;")+'</span><span class="cbar"><i style="width:'+(tot?v/tot*100:0)+'%"></i></span><span class="cval">'+fmtHuman(v)+' · '+pct+'%</span></div>';
          }).join("");
        }

        function renderChart(){
          const cv=$("#pk-chart"); if(!cv)return; const wrap=$(".cw"); let cssW=wrap?wrap.clientWidth:0; if(!cssW){requestAnimationFrame(renderChart);return;}
          const N=28, day=aggByDay(), base=new Date(); base.setHours(12,0,0,0); const days=[];
          for(let i=N-1;i>=0;i--){ const d=addDays(base,-i); const k=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); days.push({d,v:day[k]?day[k].ms:0}); }
          const maxMs=Math.max(1,...days.map(x=>x.v));
          const W=Math.max(320,cssW-2),H=240,dpr=window.devicePixelRatio||1;
          cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
          const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
          const padL=42,padR=12,padT=12,padB=34,plotW=W-padL-padR,plotH=H-padT-padB;
          const maxH=Math.max(1,Math.ceil(maxMs/3600000));ctx.font="10px sans-serif";ctx.textBaseline="middle";
          for(let hh=0;hh<=maxH;hh+=(maxH>6?2:1)){ const yy=padT+plotH-(hh/maxH)*plotH;ctx.strokeStyle="#1a2032";ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.fillStyle="#5a6480";ctx.textAlign="right";ctx.fillText(hh+"h",padL-6,yy); }
          const bw=plotW/N;
          days.forEach((x,i)=>{ const bx=padL+i*bw+bw*0.15,w=bw*0.7;
            if(x.v>0){ const h=(x.v/maxMs)*plotH, y=padT+plotH-h; ctx.fillStyle="#4f7dd6"; ctx.fillRect(bx,y,w,h); }
            if(i%4===0||i===N-1){ ctx.fillStyle="#5a6480";ctx.textAlign="center";ctx.font="9px sans-serif";ctx.fillText(dm(x.d),bx+w/2,H-padB+14); }
            if(x.d.getDay()===2){ ctx.strokeStyle="rgba(245,166,35,.3)";ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(bx-bw*0.15,padT);ctx.lineTo(bx-bw*0.15,padT+plotH);ctx.stroke();ctx.setLineDash([]); }
          });
        }

        let viewY=new Date().getFullYear(), viewM=new Date().getMonth();
        function renderCalendar(){
          $("#pesca-cal-name").textContent=MONTHS[viewM]+" "+viewY;
          $("#pesca-cal-dows").innerHTML=DOW.map(d=>'<div class="cal-dow">'+d+'</div>').join("");
          const grid=$("#pesca-cal-grid"), day=aggByDay();
          const first=new Date(viewY,viewM,1), lead=(first.getDay()+6)%7, ndays=new Date(viewY,viewM+1,0).getDate(), tStr=todayStr();
          const maxMs=Math.max(1,...Object.values(day).map(v=>v.ms));
          let h="";
          for(let i=0;i<lead;i++) h+='<div class="cal-cell empty"></div>';
          for(let d=1;d<=ndays;d++){ const key=viewY+"-"+pad(viewM+1)+"-"+pad(d), v=day[key];
            const bg=v?'background:rgba(79,125,214,'+(0.15+0.85*v.ms/maxMs).toFixed(2)+')':'';
            const today=key===tStr?" today":"";
            const b=v?'<div class="b">'+fmtHuman(v.ms)+'</div>':"";
            h+='<div class="cal-cell'+today+'" data-date="'+key+'" style="'+bg+'"><span class="d">'+d+'</span>'+b+'</div>';
          }
          grid.innerHTML=h;
          grid.querySelectorAll(".cal-cell[data-date]").forEach(c=>c.onclick=()=>{ $("#pk-date").value=c.dataset.date; toast("Data selecionada: "+dm(parseDate(c.dataset.date))); });
          let mMs=0,nd=0; Object.keys(day).forEach(k=>{ if(k.startsWith(viewY+"-"+pad(viewM+1))){mMs+=day[k].ms;nd++;} });
          $("#pesca-cal-sum").innerHTML="No mês exibido: <b>"+fmtHuman(mMs)+"</b> em <b>"+nd+"</b> dias";
        }

        function renderHistory(){
          const list=[...S.sessions].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.id-a.id));
          const body=$("#pesca-h-body"), empty=$("#pesca-h-empty");
          if(!list.length){ body.innerHTML=""; empty.style.display="block"; return; }
          empty.style.display="none";
          body.innerHTML=list.map(s=>{ const d=parseDate(s.date);
            if(s.id===editingId){
              return '<tr><td><input type="date" id="pesca-ed-date" value="'+s.date+'" style="min-width:130px"></td>'+
                '<td><input type="text" id="ed-char" value="'+(s.char?s.char.replace(/"/g,"&quot;"):"")+'" placeholder="personagem" style="max-width:130px"></td>'+
                '<td colspan="2"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end"><input type="text" id="pesca-ed-time" value="'+fmt(s.durationMs)+'" style="max-width:84px"><input type="text" id="pesca-ed-note" value="'+(s.note?s.note.replace(/"/g,"&quot;"):"")+'" placeholder="nota" style="max-width:140px"><button class="mini start" id="pesca-ed-save">✔</button><button class="mini ghost" id="pesca-ed-cancel">✕</button></div></td></tr>';
            }
            return '<tr><td>'+dm(d)+'/'+d.getFullYear()+'<div style="font-size:10px;color:var(--muted2)">'+DOWFULL[d.getDay()]+'</div></td>'+
              '<td>'+(s.char?s.char.replace(/</g,"&lt;"):'<span style="color:var(--muted2)">—</span>')+(s.note?'<div style="font-size:10px;color:var(--muted2);font-style:italic">'+s.note.replace(/</g,"&lt;")+'</div>':'')+'</td>'+
              '<td style="text-align:right;color:var(--gold);font-variant-numeric:tabular-nums">'+fmtHuman(s.durationMs)+'</td>'+
              '<td style="text-align:right"><span class="ico" data-edit="'+s.id+'">✎</span><span class="ico del" data-del="'+s.id+'">✕</span></td></tr>';
          }).join("");
          body.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ editingId=Number(b.dataset.edit); renderHistory(); });
          body.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(confirm("Apagar esta sessão?")){ S.sessions=S.sessions.filter(x=>x.id!==Number(b.dataset.del)); await saveState(); renderAll(); } });
          const save=$("#pesca-ed-save"); if(save){ save.onclick=async()=>{ const s=S.sessions.find(x=>x.id===editingId); if(s){ s.date=$("#pesca-ed-date").value||s.date; s.char=($("#ed-char").value||"").trim(); const ms=parseHMS($("#pesca-ed-time").value); if(ms>0)s.durationMs=ms; s.note=($("#pesca-ed-note").value||"").trim(); } editingId=null; await saveState(); renderAll(); toast("Sessão atualizada"); }; }
          const cancel=$("#pesca-ed-cancel"); if(cancel) cancel.onclick=()=>{ editingId=null; renderHistory(); };
        }

        function renderAll(){ renderTimer(); renderStats(); renderDist(); renderChart(); renderCalendar(); renderHistory(); }

        $("#pk-start").onclick=startPause;
        $("#pk-stop").onclick=stopToForm;
        $("#pk-reset").onclick=resetTimer;
        $("#pk-add").onclick=addSession;
        $("#d-all").onclick=()=>{distMode="all";renderDist();};
        $("#d-month").onclick=()=>{distMode="month";renderDist();};
        $("#d-cycle").onclick=()=>{distMode="cycle";renderDist();};
        $("#pesca-cal-prev").onclick=()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderCalendar(); };
        $("#pesca-cal-next").onclick=()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderCalendar(); };
        $("#pk-wipe").onclick=async()=>{ if(confirm("Apagar TODAS as sessões de pesca e recomeçar?")){ S=freshState(); await saveState(); renderAll(); toast("Tudo apagado"); } };
        window.addEventListener("resize",()=>{ if($("#pk-chart"))renderChart(); });

        if(window.__pkFocus){ window.removeEventListener("focus",window.__pkFocus); }
        if(window.__pkVis){ document.removeEventListener("visibilitychange",window.__pkVis); }
        window.__pkFocus=async()=>{ const el=$("#pk-timer"); if(!el||!document.body.contains(el)) return; if(editingId!==null){ renderTimer(); return; } try{ S=await loadState(); }catch(e){} renderAll(); if(S.timer.running) startTick(); };
        window.__pkVis=()=>{ if(!document.hidden) window.__pkFocus(); };
        window.addEventListener("focus",window.__pkFocus);
        document.addEventListener("visibilitychange",window.__pkVis);

        $("#pk-date").value=todayStr();
        renderAll();
        if(S.timer.running) startTick();
      }

      const RUN={leveling:run_leveling,log:run_log,main:run_main,pesca:run_pesca};
      const _ran={};
      async function _ensure(k){ if(_ran[k])return; _ran[k]=true; const el=CROOT.querySelector('[data-sec="'+k+'"]'); try{ await RUN[k](el); }catch(e){ _ran[k]=false; console.log('painel '+k+' erro',e); } }

      await _ensure(_active);
      _apply();
      setTimeout(_redraw,300);

    });
  </script>
