<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDNIGHT · Metas</title>
  <style>
    :root {
      --panel: #0f1420;
      --panel2: #111828;
      --border: #252d42;
      --border2: #1a2032;
      --gold: #c9a84c;
      --gold2: #e4c76a;
      --text: #d4ddf0;
      --muted: #8a94a8;
      --muted2: #5a6480;
      --green: #4ecb8e;
      --amber: #f5a623;
      --red: #e05a5a;
      --accent: #7c6cff;
      --blue: #4f7dd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--panel2);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-family: Georgia, serif;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: .5px;
    }
    .brand p { font-size: 11px; color: var(--muted); }
    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    nav a:hover { filter: brightness(1.2); color: var(--text); }
    nav a.active {
      background: var(--gold);
      color: #0b0f18;
      border-color: var(--gold);
    }
    .main-wrap {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
    }
    #metas-root {
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 22px;">🌙</span>
      <div>
        <h1>MIDNIGHT</h1>
        <p>Warband & Economy Web App</p>
      </div>
    </div>
    <nav>
      <a href="index.html">Hub</a>
      <a href="atividades.html">Atividades</a>
      <a href="profissoes.html">Profissões</a>
      <a href="metas.html" class="active">Metas</a>
      <a href="perfil.html">Perfil</a>
      <a href="economia.html">Economia</a>
    </nav>
  </header>

  <div class="main-wrap">
    <div id="metas-root"></div>
  </div>

  <script>
    // --- ADAPTADOR DO OBSIDIAN (FALSO) ---
    const app = {
      vault: {
        adapter: {
          exists: async (path) => localStorage.getItem("MDN_" + path) !== null,
          read: async (path) => localStorage.getItem("MDN_" + path) || "{}",
          write: async (path, data) => localStorage.setItem("MDN_" + path, data),
          list: async (folder) => ({ files: [] }),
          remove: async (path) => localStorage.removeItem("MDN_" + path)
        },
        getAbstractFileByPath: (path) => null
      }
    };
    const dv = { current: () => ({ file: { folder: "" } }) };

    document.addEventListener("DOMContentLoaded", async () => {
      dv.container = document.getElementById("metas-root");
      
      const root = dv.container;
      const folder = dv.current().file.folder;
      const DATA_PATH = (folder ? folder + "/" : "") + "MIDNIGHT_Metas_Data.json";
      const adapter = app.vault.adapter;

      function freshState(){ return { goals:[], timer:{running:false,goalId:null,startedAt:null,accumulated:0}, timeSessions:[] }; }
      async function loadState(){
        try{ if(await adapter.exists(DATA_PATH)){ const p=JSON.parse(await adapter.read(DATA_PATH)); const b=freshState(); b.goals=Array.isArray(p.goals)?p.goals:[]; b.timer=Object.assign(b.timer,p.timer||{}); b.timeSessions=Array.isArray(p.timeSessions)?p.timeSessions:[]; return b; } }
        catch(e){}
        return freshState();
      }
      let saving=false,pending=false;
      async function saveState(){ if(saving){pending=true;return;} saving=true;
        try{ await adapter.write(DATA_PATH, JSON.stringify(S)); }catch(e){}
        saving=false; if(pending){pending=false;saveState();} }
      let S = await loadState();

      const $=s=>root.querySelector(s);
      function pad(n){return String(n).padStart(2,"0");}
      function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
      function parseDate(s){const p=(s||"").split("-").map(n=>parseInt(n,10));return new Date(p[0],(p[1]||1)-1,p[2]||1,12,0,0);}
      function dmy(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
      function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
      function escA(s){return (s||"").replace(/"/g,"&quot;");}
      function isDone(g){ if(g.type==="weekly") return false; return g.type==="counter" ? (g.current||0)>=(g.target||0) : !!g.done; }
      
      const RESET_DOW=2, RESET_HOUR=12;
      function cycleStart(d){ const t=new Date(d); t.setHours(RESET_HOUR,0,0,0); const diff=((t.getDay()-RESET_DOW)+7)%7; t.setDate(t.getDate()-diff); if(t>d) t.setDate(t.getDate()-7); return t; }
      function cycleKey(d){ return cycleStart(d).getTime(); }
      function fmtGold(n){ n=n||0; const a=Math.abs(n); if(a>=1e6) return (n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+"M"; if(a>=1e3) return (n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+"k"; return n.toLocaleString('pt-BR'); }
      function fmt(ms){const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);}
      function fmtHuman(ms){const t=Math.floor(ms/60000),h=Math.floor(t/60),m=t%60;return h>0?h+"h"+(m?" "+pad(m):""):m+"min";}
      function parseHMS(s){ s=(s||"").trim(); if(!s)return 0; if(s.includes(":")){ const p=s.split(":").map(n=>parseInt(n,10)||0); let h=0,m=0,sec=0; if(p.length===2){h=p[0];m=p[1];}else if(p.length>=3){h=p[0];m=p[1];sec=p[2];}else{m=p[0];} return ((h*3600)+(m*60)+sec)*1000; } const mins=parseFloat(s.replace(",",".")); return Math.round(mins*60000); }
      function fmtRate(v){ return (v>=100?Math.round(v):Math.round(v*10)/10).toLocaleString('pt-BR',{maximumFractionDigits:1}); }
      function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
      function dm(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1);}
      function dateStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
      
      const LONG_RUN_MS=8.5*3600*1000;
      function rollover(g){ if(g.type!=="weekly"||(g.source&&g.source!=="manual")) return false; const ck=cycleKey(new Date()); if(g.cycleKey==null){ g.cycleKey=ck; if(g.current==null)g.current=0; return true; } if(g.cycleKey!==ck){ g.history=g.history||[]; g.history.push({cycle:g.cycleKey,amount:g.current||0,target:g.target,hit:(g.current||0)>=g.target}); if(g.history.length>52)g.history=g.history.slice(-52); g.current=0; g.cycleKey=ck; return true; } return false; }
      function rolloverAll(){ let ch=false; S.goals.forEach(g=>{ if(rollover(g))ch=true; }); if(ch) saveState(); }

      const SOURCES=[
        {key:"manual",label:"Manual (você registra)"},
        {key:"pesca_h",label:"Pesca — horas no ciclo",unit:"h"},
        {key:"pesca_sess",label:"Pesca — sessões no ciclo",unit:"n"},
        {key:"log_voltas",label:"Log — voltas dos 70 no ciclo",unit:"x"},
        {key:"log_pers",label:"Log — personagens no ciclo",unit:"n"},
        {key:"main_h",label:"Main — horas no ciclo",unit:"h"},
        {key:"total_h",label:"Tempo total de jogo — horas no ciclo",unit:"h"}
      ];
      const SRCMAP=Object.fromEntries(SOURCES.map(s=>[s.key,s]));
      
      let EXT={records:[]};
      async function loadExternal(){
        const rec=[], rd=async f=>{ try{ const p=(folder?folder+"/":"")+f; if(await adapter.exists(p)) return JSON.parse(await adapter.read(p)); }catch(e){} return null; };
        const lvl=await rd("MIDNIGHT_Leveling_Data.json"); if(lvl&&Array.isArray(lvl.sessions)) lvl.sessions.forEach(s=>{ if(s&&s.endedAt){ const d=new Date(s.endedAt); rec.push({date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),ms:s.durationMs||0,src:"lvl"}); } });
        const log=await rd("MIDNIGHT_Log_Data.json"); if(log&&Array.isArray(log.entries)) log.entries.forEach(e=>{ if(e&&e.date) rec.push({date:e.date,ms:e.durationMs||0,chars:e.chars||0,src:"log"}); });
        const main=await rd("MIDNIGHT_Main_Data.json"); if(main&&Array.isArray(main.entries)) main.entries.forEach(e=>{ if(e&&e.date) rec.push({date:e.date,ms:e.durationMs||0,src:"main"}); });
        const pesca=await rd("MIDNIGHT_Pesca_Data.json"); if(pesca&&Array.isArray(pesca.sessions)) pesca.sessions.forEach(s=>{ if(s&&s.date) rec.push({date:s.date,ms:s.durationMs||0,src:"pesca"}); });
        EXT.records=rec;
      }
      
      function autoValueForCycle(src,ck){ const R=EXT.records, inC=r=>cycleKey(parseDate(r.date))===ck;
        switch(src){
          case "pesca_h": return R.filter(r=>r.src==="pesca"&&inC(r)).reduce((a,r)=>a+r.ms,0)/3600000;
          case "pesca_sess": return R.filter(r=>r.src==="pesca"&&inC(r)).length;
          case "log_voltas": return R.filter(r=>r.src==="log"&&inC(r)).reduce((a,r)=>a+(r.chars||0),0)/70;
          case "log_pers": return R.filter(r=>r.src==="log"&&inC(r)).reduce((a,r)=>a+(r.chars||0),0);
          case "main_h": return R.filter(r=>r.src==="main"&&inC(r)).reduce((a,r)=>a+r.ms,0)/3600000;
          case "total_h": return R.filter(inC).reduce((a,r)=>a+r.ms,0)/3600000;
          default: return 0;
        }
      }
      function autoValue(src){ return autoValueForCycle(src,cycleKey(new Date())); }
      function autoWeeksHit(src,target){ const cks=[...new Set(EXT.records.map(r=>cycleKey(parseDate(r.date))))]; const cur=cycleKey(new Date()); return cks.filter(ck=>ck<cur && autoValueForCycle(src,ck)>=target).length + (autoValue(src)>=target?1:0); }
      function fmtUnit(v,unit){ if(unit==="h") return (Math.round(v*10)/10).toLocaleString('pt-BR',{maximumFractionDigits:1})+"h"; if(unit==="x") return (Math.round(v*10)/10).toLocaleString('pt-BR',{maximumFractionDigits:1})+"×"; return String(Math.round(v)); }

      let editingId=null, filter="andamento", catFilter="";
      root.innerHTML=`<style>
      .mtx{--panel:#0f1420;--panel2:#111828;--border:#252d42;--border2:#1a2032;--gold:#c9a84c;--gold2:#e4c76a;--text:#d4ddf0;--muted:#8a94a8;--muted2:#5a6480;--green:#4ecb8e;--amber:#f5a623;--red:#e05a5a;--blue:#4f7dd6;font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);width:100%;max-width:100%;box-sizing:border-box}
      .mtx *{box-sizing:border-box}
      .mtx .grid{display:grid;gap:20px}
      .mtx .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:14px;padding:20px;max-width:100%}
      .mtx h2.mt{font-family:Georgia,serif;font-size:14px;margin:0 0 12px;color:var(--gold);letter-spacing:.3px}
      .mtx .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
      .mtx .stat{background:var(--panel);border:1px solid var(--border2);border-radius:11px;padding:10px;text-align:center}
      .mtx .stat .n{font-family:Georgia,serif;font-size:22px;font-weight:bold;color:var(--gold)}
      .mtx .stat .l{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
      .mtx .frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
      .mtx label.sl{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;display:block;margin:0 0 6px}
      .mtx input[type=text],.mtx input[type=number],.mtx input[type=date],.mtx select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13.5px;line-height:1.5;width:100%;max-width:100%}
      .mtx select{height:auto!important;min-height:40px!important}
      .mtx button{cursor:pointer;border:none;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;color:#0b0f18;transition:0.15s;}
      .mtx button:hover{filter:brightness(1.08)}
      .mtx button.add{background:linear-gradient(180deg,var(--green),#3bb47c)}
      .mtx button.mini{padding:4px 9px;font-size:12px;background:var(--panel2);color:var(--text);border:1px solid var(--border);font-weight:600}
      .mtx button.mini:hover{border-color:var(--muted2)}
      .mtx button.save{background:linear-gradient(180deg,var(--green),#3bb47c);padding:5px 10px;font-size:12px}
      .mtx button.gh{background:transparent;color:var(--muted);border:1px solid var(--border);padding:5px 10px;font-size:12px;font-weight:600}
      .mtx .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
      .mtx .chip{font-size:11.5px;padding:6px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
      .mtx .chip.active{background:var(--gold);color:#0b0f18;border-color:var(--gold)}
      .mtx .goal{border:1px solid var(--border2);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
      .mtx .goal.done{background:rgba(78,203,142,.07);border-color:rgba(78,203,142,.25)}
      .mtx .gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .mtx .gchk{width:18px;height:18px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
      .mtx .gtitle{font-size:14px;font-weight:600;flex:1;min-width:120px}
      .mtx .goal.done .gtitle{color:var(--green)}
      .mtx .badge{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
      .mtx .badge.cat{color:var(--gold2);border-color:rgba(201,168,76,.35)}
      .mtx .badge.due{color:var(--muted)}
      .mtx .badge.over{color:var(--red);border-color:rgba(224,90,90,.4)}
      .mtx .badge.ok{color:var(--green);border-color:rgba(78,203,142,.35)}
      .mtx .ico{color:var(--muted2);cursor:pointer;font-size:13px;margin-left:6px}
      .mtx .ico:hover{color:var(--gold)}
      .mtx .ico.del:hover{color:var(--red)}
      .mtx .prog{height:10px;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;overflow:hidden;margin:10px 0 6px}
      .mtx .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7aa0e8)}
      .mtx .prog.done>i{background:linear-gradient(90deg,var(--green),#6fe0a8)}
      .mtx .gctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
      .mtx .gctrl .cur{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
      .mtx .gctrl input{max-width:90px;padding:5px 8px}
      .mtx .note{font-size:11.5px;color:var(--muted2);font-style:italic;margin-top:6px}
      .mtx .sec{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 8px}
      .mtx .semp{color:var(--muted2);font-size:12.5px;text-align:center;padding:18px 0}
      .mtx .ftr{text-align:center;color:var(--muted2);font-size:11px;margin-top:8px}
      .mtx .lnk{color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:11px;padding:0;font-weight:400}
      .mtx .lnk:hover{color:var(--red)}
      .mtx .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none;z-index:9999}
      .mtx .toast.show{opacity:1}
      .mtx .tcard{container-type:inline-size}
      .mtx .tdisp{font-family:Georgia,serif;font-weight:bold;text-align:center;letter-spacing:1px;line-height:1;padding:6px 0;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:clamp(26px,13cqw,46px)}
      .mtx .tdisp.run{color:var(--gold2);text-shadow:0 0 22px rgba(228,199,106,.25)}
      .mtx .tsub{text-align:center;color:var(--muted);font-size:12.5px;min-height:18px;margin:4px 0 12px}
      .mtx .tsub b{color:var(--text)}
      .mtx .ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
      .mtx button.start{background:linear-gradient(180deg,var(--green),#3bb47c);flex:1;min-width:100px}
      .mtx button.pause{background:linear-gradient(180deg,var(--amber),#e0930f);flex:1;min-width:100px}
      .mtx button.stop{background:linear-gradient(180deg,var(--gold),#b8973a);flex:1;min-width:100px}
      .mtx button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);flex:0 0 auto;padding:9px 13px;font-weight:600}
      .mtx .warn-box{background:rgba(224,90,90,.12);border:1px solid rgba(224,90,90,.4);color:#f0a5a5;font-size:12px;border-radius:9px;padding:8px 10px;margin-bottom:10px;text-align:center}
      .mtx .gtime{font-size:12px;color:var(--muted)}
      .mtx .gtime button.mini{padding:3px 9px}
      .mtx .tbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
      .mtx .tbar .tbn{width:150px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
      .mtx .tbar .tbb{flex:1;height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}
      .mtx .tbar .tbb>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
      .mtx .tbar .tbv{width:80px;text-align:right;flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
      .mtx .cw{width:100%;max-width:100%;overflow-x:auto}
      .mtx canvas{display:block}
      .mtx table{width:100%;border-collapse:collapse;font-size:12.5px}
      .mtx th{text-align:left;color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border-bottom:1px solid var(--border)}
      .mtx td{padding:7px 9px;border-bottom:1px solid var(--border2)}
      .mtx .sscroll{max-height:260px;overflow-y:auto}
      @media (max-width:560px){.mtx .stats{grid-template-columns:repeat(2,1fr)}}
      </style>

        </div>

          <div class="card tcard">
            <h2 class="mt">⏱️ Cronômetro de meta</h2>
            <div class="warn-box" id="tm-warn" style="display:none"></div>
            <div class="tdisp" id="tm-disp">00:00:00</div>
            <div class="tsub" id="tm-sub">Escolha uma meta e inicie o cronômetro</div>
            <label class="sl">Meta em foco</label>
            <select id="tm-sel"></select>
            <div class="ctrls">
              <button class="start" id="tm-start">▶ Iniciar</button>
              <button class="stop" id="tm-stop" disabled>■ Encerrar</button>
              <button class="ghost" id="tm-reset" title="Zerar sem salvar">↺</button>
            </div>
            <label class="sl" style="margin-top:10px">Nota da sessão (opcional)</label>
            <input type="text" id="tm-note" placeholder="ex.: farm em Azj-Kahet">
          </div>
          <div class="card">
            <h2 class="mt">➕ Nova meta</h2>
            <div class="frm">
              <div style="grid-column:1/-1"><label class="sl">Meta</label><input type="text" id="n-title" placeholder="ex.: Pescar 2500 itens nas Ilhas Enroladas"></div>
              <div><label class="sl">Tipo</label><select id="n-type"><option value="counter">Contador (0/alvo)</option><option value="check">Simples (concluir)</option><option value="weekly">💰 Ouro/semana (recorrente)</option></select></div>

        const weekly=gs.filter(g=>g.type==="weekly");
        const oneoff=gs.filter(g=>g.type!=="weekly");
        const open=oneoff.filter(g=>!isDone(g)), done=oneoff.filter(isDone);
        const sortOpen=(a,b)=>{ const ad=a.due||"9999", bd=b.due||"9999"; return ad<bd?-1:ad>bd?1:(a.createdAt-b.createdAt); };
        open.sort(sortOpen); done.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)); weekly.sort((a,b)=>a.createdAt-b.createdAt);
        let h="";
        if(weekly.length){ h+='<div class="sec">💰 Semanais — reinicia terça 12h</div>'+weekly.map(goalRow).join(""); }
        if(filter==="todas"||filter==="andamento"){ if(open.length){ h+='<div class="sec"'+(weekly.length?' style="margin-top:14px"':'')+'>Em andamento ('+open.length+')</div>'+open.map(goalRow).join(""); } }
        if(filter==="todas"||filter==="concluidas"){ if(done.length){ h+='<div class="sec" style="margin-top:14px">Concluídas ('+done.length+')</div>'+done.map(goalRow).join(""); } }
        box.innerHTML=h; empty.style.display=(h?"none":"block");
        box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addTo(Number(b.dataset.add),parseInt(b.dataset.d,10)));
        box.querySelectorAll("[data-set]").forEach(inp=>inp.onchange=()=>{ const v=parseInt(inp.value,10); if(!isNaN(v)) setCurrent(Number(inp.dataset.set),v); inp.value=""; });
        box.querySelectorAll("[data-chk]").forEach(cb=>cb.onchange=()=>toggleCheck(Number(cb.dataset.chk),cb.checked));
        box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delGoal(Number(b.dataset.del)));
        box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ editingId=Number(b.dataset.edit); renderList(); });
        box.querySelectorAll("[data-timer]").forEach(b=>b.onclick=()=>startGoalTimer(Number(b.dataset.timer)));
        const es=$("#e-save"); if(es){ es.onclick=async()=>{ const g=S.goals.find(x=>x.id===editingId); if(g){ g.title=($("#e-title").value\vert{}\vert{}"").trim()\vert{}\vert{}g.title; g.type=$("#e-type").value; let t=parseInt($("#e-target").value,10); g.target=g.type==="check"?1:(isNaN(t)\vert{}\vert{}t<1?1:t); g.cat=($("#e-cat").value||"").trim(); g.due=$("#e-due").value\vert{}\vert{}""; g.note=($("#e-note").value||"").trim(); if(g.type==="check")g.current=g.done?1:0; if(g.type==="counter"){ if(g.current>=g.target){g.done=true;g.doneAt=g.doneAt||Date.now();}else{g.done=false;g.doneAt=null;} } if(g.type==="weekly"){ g.source=$("#e-source")?$("#e-source").value:"manual"; if(g.source==="manual"&&g.cycleKey==null){ g.cycleKey=cycleKey(new Date()); g.history=g.history||[]; } } else { g.source="manual"; } } editingId=null; await saveState(); renderAll(); toast("Meta atualizada"); }; }
        const ec=$("#e-cancel"); if(ec) ec.onclick=()=>{ editingId=null; renderList(); };
      }
      function toggleTargetField(){ const t=$("#n-type").value; const tw=$("#n-target-wrap"); if(tw) tw.style.display=t!=="check"?"":"none"; const sw=$("#n-source-wrap"); if(sw) sw.style.display=t==="weekly"?"":"none"; }

      function renderAll(){ renderStats(); renderList(); renderTimeSelect(); renderTimer(); renderTimeStats(); renderTimeBars(); renderTimeTrend(); renderTimeHistory(); }

      $("#n-add").onclick=addGoal;
      $("#n-type").onchange=toggleTargetField;
      $("#tm-start").onclick=startPause;
      $("#tm-stop").onclick=stopSession;
      $("#tm-reset").onclick=resetTimer;
      $("#tm-sel").onchange=async e=>{ if(!S.timer.running&&(S.timer.accumulated||0)===0){ S.timer.goalId=e.target.value===""?null:Number(e.target.value); await saveState(); renderTimer(); } };
      root.querySelectorAll(".chip[data-f]").forEach(ch=>ch.onclick=()=>{ root.querySelectorAll(".chip[data-f]").forEach(c=>c.classList.remove("active")); ch.classList.add("active"); filter=ch.dataset.f; renderList(); });
      $("#f-cat").onchange=e=>{ catFilter=e.target.value; renderList(); };
      $("#m-wipe").onclick=async()=>{ if(confirm("Apagar TODAS as metas e recomeçar?")){ S=freshState(); stopTick(); await saveState(); renderAll(); toast("Tudo apagado"); } };
      window.addEventListener("resize",()=>{ if($("#tt-chart"))renderTimeTrend(); });

      $("#n-source").innerHTML=SOURCES.map(s=>'<option value="'+s.key+'">'+s.label+'</option>').join("");
      toggleTargetField();
      await loadExternal();
      renderAll();
      if(S.timer.running) startTick();
    });
  </script>
</body>
</html>
