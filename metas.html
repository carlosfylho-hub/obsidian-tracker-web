<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDNIGHT · Metas</title>
  <style>
    :root {
      --panel: #0f1420;
      --panel2: #111828;
      --border: #252d42;
      --border2: #1a2032;
      --gold: #c9a84c;
      --gold2: #e4c76a;
      --text: #d4ddf0;
      --muted: #8a94a8;
      --muted2: #5a6480;
      --green: #4ecb8e;
      --amber: #f5a623;
      --red: #e05a5a;
      --accent: #7c6cff;
      --blue: #4f7dd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--panel2);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-family: Georgia, serif; font-size: 18px; color: var(--gold); letter-spacing: .5px; }
    .brand p { font-size: 11px; color: var(--muted); }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav a {
      text-decoration: none; padding: 7px 14px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--panel); color: var(--muted);
      font-size: 13px; font-weight: 600; transition: all 0.15s;
    }
    nav a:hover { filter: brightness(1.2); color: var(--text); }
    nav a.active { background: var(--gold); color: #0b0f18; border-color: var(--gold); }
    .main-wrap { max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; flex: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 22px;">🌙</span>
      <div>
        <h1>MIDNIGHT</h1>
        <p>Warband & Economy Web App</p>
      </div>
    </div>
    <nav>
      <a href="index.html">Hub</a>
      <a href="atividades.html">Atividades</a>
      <a href="profissoes.html">Profissões</a>
      <a href="metas.html" class="active">Metas</a>
      <a href="perfil.html">Perfil</a>
      <a href="economia.html">Economia</a>
    </nav>
  </header>

  <div class="main-wrap">
    <div id="metas-root"></div>
  </div>

  <script>
    // Adaptador LocalStorage para simular o Obsidian
    const app = {
      vault: {
        adapter: {
          exists: async (path) => localStorage.getItem("MDN_" + path) !== null,
          read: async (path) => localStorage.getItem("MDN_" + path) || "{}",
          write: async (path, data) => localStorage.setItem("MDN_" + path, data),
          list: async (folder) => ({ files: [] }),
          remove: async (path) => localStorage.removeItem("MDN_" + path)
        },
        getAbstractFileByPath: (path) => null
      }
    };
    const dv = { current: () => ({ file: { folder: "" } }) };

    document.addEventListener("DOMContentLoaded", async () => {
      dv.container = document.getElementById("metas-root");
      const root = dv.container;
      const DATA_PATH = "MIDNIGHT_Metas_Data.json";
      const adapter = app.vault.adapter;

      function freshState(){ return { goals:[], timer:{running:false,goalId:null,startedAt:null,accumulated:0}, timeSessions:[] }; }
      async function loadState(){
        try{ if(await adapter.exists(DATA_PATH)){ const p=JSON.parse(await adapter.read(DATA_PATH)); const b=freshState(); b.goals=Array.isArray(p.goals)?p.goals:[]; b.timer=Object.assign(b.timer,p.timer||{}); b.timeSessions=Array.isArray(p.timeSessions)?p.timeSessions:[]; return b; } }
        catch(e){}
        return freshState();
      }
      let saving=false,pending=false;
      async function saveState(){ if(saving){pending=true;return;} saving=true;
        try{ await adapter.write(DATA_PATH, JSON.stringify(S)); }catch(e){}
        saving=false; if(pending){pending=false;saveState();} }
      let S = await loadState();

      const $=s=>root.querySelector(s);
      function pad(n){return String(n).padStart(2,"0");}
      function dmy(d){return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
      function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
      function escA(s){return (s||"").replace(/"/g,"&quot;");}
      function isDone(g){ if(g.type==="weekly") return false; return g.type==="counter" ? (g.current||0)>=(g.target||0) : !!g.done; }
      
      const RESET_DOW=2, RESET_HOUR=12;
      function cycleStart(d){ const t=new Date(d); t.setHours(RESET_HOUR,0,0,0); const diff=((t.getDay()-RESET_DOW)+7)%7; t.setDate(t.getDate()-diff); if(t>d) t.setDate(t.getDate()-7); return t; }
      function cycleKey(d){ return cycleStart(d).getTime(); }
      function fmtGold(n){ n=n||0; const a=Math.abs(n); if(a>=1e6) return (n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+"M"; if(a>=1e3) return (n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+"k"; return n.toLocaleString('pt-BR'); }
      function fmt(ms){const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);}
      function fmtHuman(ms){const t=Math.floor(ms/60000),h=Math.floor(t/60),m=t%60;return h>0?h+"h"+(m?" "+pad(m):""):m+"min";}
      function parseHMS(s){ s=(s||"").trim(); if(!s)return 0; if(s.includes(":")){ const p=s.split(":").map(n=>parseInt(n,10)||0); let h=0,m=0,sec=0; if(p.length===2){h=p[0];m=p[1];}else if(p.length>=3){h=p[0];m=p[1];sec=p[2];}else{m=p[0];} return ((h*3600)+(m*60)+sec)*1000; } const mins=parseFloat(s.replace(",",".")); return Math.round(mins*60000); }

      let filter="andamento", catFilter="";
      root.innerHTML = `
        <style>
          .mtx { --panel:#0f1420; --panel2:#111828; --border:#252d42; --border2:#1a2032; --gold:#c9a84c; --gold2:#e4c76a; --text:#d4ddf0; --muted:#8a94a8; --muted2:#5a6480; --green:#4ecb8e; --amber:#f5a623; --red:#e05a5a; --blue:#4f7dd6; font-family:'Segoe UI',sans-serif; color:var(--text); width:100%; }
          .mtx .card { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
          .mtx h2.mt { font-family: Georgia, serif; font-size: 15px; margin: 0 0 12px; color: var(--gold); border-bottom: 1px solid var(--border2); padding-bottom: 8px; }
          .mtx .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
          .mtx .stat { background: var(--panel); border: 1px solid var(--border2); border-radius: 11px; padding: 10px; text-align: center; }
          .mtx .stat .n { font-family: Georgia, serif; font-size: 22px; font-weight: bold; color: var(--gold); }
          .mtx .stat .l { font-size: 10px; color: var(--muted2); text-transform: uppercase; margin-top: 2px; }
          .mtx input, .mtx select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; font-size: 13.5px; width: 100%; }
          .mtx button { cursor: pointer; border: none; border-radius: 9px; padding: 9px 15px; font-weight: 600; color: #0b0f18; background: var(--gold); }
          .mtx button:hover { filter: brightness(1.15); }
          .mtx .goal { border: 1px solid var(--border2); border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
          .mtx .goal.done { background: rgba(78,203,142,.07); border-color: rgba(78,203,142,.25); }
          .mtx .gtop { display: flex; align-items: center; gap: 10px; }
          .mtx .gtitle { font-size: 14px; font-weight: 600; flex: 1; }
          .mtx .prog { height: 10px; background: var(--panel2); border-radius: 8px; overflow: hidden; margin: 10px 0 6px; }
          .mtx .prog > i { display: block; height: 100%; background: var(--blue); }
          .mtx .prog.done > i { background: var(--green); }
        </style>
        <div class="mtx">
          <div class="stats">
            <div class="stat"><div class="n" id="s-total">0</div><div class="l">Metas</div></div>
            <div class="stat"><div class="n" id="s-open">0</div><div class="l">Em andamento</div></div>
            <div class="stat"><div class="n" id="s-done">0</div><div class="l">Concluídas</div></div>
            <div class="stat"><div class="n" id="s-pct">0%</div><div class="l">Progresso</div></div>
          </div>
          
          <div class="card">
            <h2 class="mt">➕ Adicionar Nova Meta</h2>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items:end;">
              <div><label style="font-size:11px; color:var(--muted2)">Título da Meta</label><input type="text" id="n-title" placeholder="Ex: Farmar Ouro / Upar Profissão"></div>
              <div><label style="font-size:11px; color:var(--muted2)">Tipo</label><select id="n-type"><option value="counter">Contador</option><option value="check">Simples</option></select></div>
              <div><label style="font-size:11px; color:var(--muted2)">Alvo</label><input type="number" id="n-target" value="100"></div>
              <div><button id="n-add" class="add" style="background:var(--green); color:#0b0f18">Adicionar</button></div>
            </div>
          </div>

          <div class="card">
            <h2 class="mt">📋 Suas Metas</h2>
            <div id="list"></div>
            <div id="list-empty" style="text-align:center; color:var(--muted2); padding:20px;">Nenhuma meta registada ainda.</div>
          </div>
        </div>
      `;

      function renderStats() {
        const n = S.goals.length, done = S.goals.filter(isDone).length;
        $("#s-total").textContent = n;
        $("#s-open").textContent = n - done;
        $("#s-done").textContent = done;
        $("#s-pct").textContent = (n ? Math.round(done / n * 100) : 0) + "%";
      }

      function renderList() {
        const box = $("#list"), empty = $("#list-empty");
        if (!S.goals.length) { box.innerHTML = ""; empty.style.display = "block"; return; }
        empty.style.display = "none";

        box.innerHTML = S.goals.map(g => {
          const done = isDone(g);
          const pct = g.target ? Math.min(100, (g.current || 0) / g.target * 100) : 0;
          return `
            <div class="goal ${done ? 'done' : ''}">
              <div class="gtop">
                <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleGoal(${g.id}, this.checked)" style="width:18px;height:18px;cursor:pointer;">
                <span class="gtitle">${esc(g.title)}</span>
                <span style="cursor:pointer; color:var(--muted2);" onclick="removeGoal(${g.id})">✕</span>
              </div>
              <div class="prog ${done ? 'done' : ''}"><i style="width:${pct}%"></i></div>
              <div style="font-size:12px; color:var(--muted); display:flex; justify-content:space-between;">
                <span>Progresso: <b>${g.current || 0} / ${g.target}</b></span>
                <div>
                  <button class="mini" onclick="addProgress(${g.id}, -1)">-1</button>
                  <button class="mini" onclick="addProgress(${g.id}, 1)">+1</button>
                </div>
              </div>
            </div>
          `;
        }).join("");
      }

      window.toggleGoal = async (id, val) => {
        const g = S.goals.find(x => x.id === id);
        if (g) { g.done = val; if(g.type==='counter') g.current = val ? g.target : 0; await saveState(); renderAll(); }
      };

      window.addProgress = async (id, delta) => {
        const g = S.goals.find(x => x.id === id);
        if (g) { g.current = Math.max(0, (g.current || 0) + delta); await saveState(); renderAll(); }
      };

      window.removeGoal = async (id) => {
        S.goals = S.goals.filter(x => x.id !== id);
        await saveState(); renderAll();
      };

      function renderAll() { renderStats(); renderList(); }

      $("#n-add").onclick = async () => {
        const title = $("#n-title").value.trim();
        const target = parseInt($("#n-target").value, 10) || 100;
        const type = $("#n-type").value;
        if (!title) return;
        S.goals.push({ id: Date.now(), title, type, target, current: 0, done: false });
        await saveState();
        $("#n-title").value = "";
        renderAll();
      };

      renderAll();
    });
  </script>
</body>
</html>
