<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDNIGHT · Profissões</title>
  <style>
    :root {
      --panel: #0f1420;
      --panel2: #111828;
      --border: #252d42;
      --border2: #1a2032;
      --gold: #c9a84c;
      --gold2: #e4c76a;
      --text: #d4ddf0;
      --muted: #8a94a8;
      --muted2: #5a6480;
      --green: #4ecb8e;
      --amber: #f5a623;
      --red: #e05a5a;
      --accent: #7c6cff;
      --cyan: #22d3ee;
      --blue: #4f7dd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--panel2);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-family: Georgia, serif;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: .5px;
    }
    .brand p { font-size: 11px; color: var(--muted); }
    nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    nav a {
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    nav a:hover { filter: brightness(1.2); color: var(--text); }
    nav a.active {
      background: var(--gold);
      color: #0b0f18;
      border-color: var(--gold);
    }
    .main-wrap {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
    }
    #profissoes-root {
      width: 100%;
    }
  </style>
</head>

          const outrosKeys=Object.keys(S.prices).filter(k=>!KNOWN[k]);
          const pricedVals=Object.keys(KNOWN).map(priceOf).filter(v=>v>0);
          const avg=pricedVals.length?pricedVals.reduce((a,b)=>a+b,0)/pricedVals.length:0;
          $("#mz-k1").textContent=known; $("#mz-k2").textContent=totalCat; $("#mz-k3").textContent=outrosKeys.length; $("#mz-k4").textContent=avg?fmtPrice(avg):"—";
          $("#mz-when").textContent = S.importedAt?("atualizado em "+new Date(S.importedAt).toLocaleString('pt-BR')):"sem importação ainda";
          
          const box=$("#mz-cats"); let html="";
          CATS.forEach(([cat,items])=>{
            let rows=items.map(it=>({name:it,key:nk(it),gold:priceOf(nk(it))}));
            if(term) rows=rows.filter(r=>r.key.includes(term));
            if(!rows.length)return;
            if(sortBy==="price") rows.sort((a,b)=>b.gold-a.gold);
            const nPriced=rows.filter(r=>r.gold>0).length;
            html+='<div class="sg"><h3>'+esc(cat)+' <span>'+nPriced+'/'+rows.length+'</span></h3>'+
              rows.map(r=>'<div class="mrow'+(r.gold>0?'':' miss')+'"><span class="mn" title="'+esc(r.name)+'">'+esc(r.name)+'</span><span class="mp">'+fmtPrice(r.gold)+'</span></div>').join("")+'</div>';
          });
          box.innerHTML=html||'<div class="semp">Nenhum material encontrado'+(term?" para a busca.":". Importe um avg export acima.")+'</div>';
          
          const ob=$("#mz-outros");
          let outros=outrosKeys.map(k=>({name:S.prices[k].name,key:k,gold:priceOf(k)}));
          if(term) outros=outros.filter(r=>r.key.includes(term));
          outros.sort((a,b)=>b.gold-a.gold);
          if(outros.length){
            ob.innerHTML='<div class="sg" style="margin-top:4px"><h3 style="cursor:pointer" id="mz-outros-h">📦 Não classificados (crafts/produtos) <span>'+outros.length+' · '+(S.showOutros?"ocultar":"mostrar")+'</span></h3>'+
              (S.showOutros? outros.map(r=>'<div class="mrow"><span class="mn" title="'+esc(r.name)+'">'+esc(r.name)+'</span><span class="mp">'+fmtPrice(r.gold)+'</span></div>').join("") : '')+'</div>';
            const h=$("#mz-outros-h"); if(h) h.onclick=async()=>{ S.showOutros=!S.showOutros; await saveState(); render(); };
          } else ob.innerHTML="";
        }

        $("#mz-btn").onclick=doImport;
        $("#mz-imp").oninput=updatePrev;
        $("#mz-copper").onchange=updatePrev;
        $("#mz-clear").onclick=async()=>{ if(!Object.keys(S.prices).length)return; if(confirm("Apagar todos os preços importados?")){ S.prices={}; S.importedAt=0; await saveState(); render(); } };
        $("#mz-search").oninput=render;
        $("#mz-sort").onchange=async e=>{ S.sort=e.target.value==="price"?"price":"cat"; await saveState(); render(); };

        if(window.__mzFocus){ window.removeEventListener("focus",window.__mzFocus); }
        window.__mzFocus=async()=>{ const el=$("#mz-cats"); if(!el||!document.body.contains(el))return; try{ S=await loadState(); }catch(e){} if($("#mz-sort"))$("#mz-sort").value=S.sort; render(); };
        window.addEventListener("focus",window.__mzFocus);

        if($("#mz-sort"))$("#mz-sort").value=S.sort;
        render(); updatePrev();
      }

        const $=s=>root.querySelector(s);

        function nk(s){ return String(s||"").trim().replace(/\s+/g," ").toLowerCase(); }
        function fmtK(n){ n=Number(n)||0; const s=n<0?"−":""; const a=Math.abs(n); let v; if(a>=1e6)v=(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+"M"; else if(a>=1e3)v=(a/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+"k"; else v=a.toLocaleString('pt-BR',{maximumFractionDigits:1}); return s+v; }
        function fmtN(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1}); }
        function parseNum(v){ const s=String(v==null?"":v).trim().replace(",","."); if(!s)return NaN; return parseFloat(s.replace(/[^0-9.\-]/g,"")); }
        const GRP_COLOR={"Poções de Luz":"#f5a623","Poções Void":"#a330c9","Phials":"#22d3ee","Flasks":"#4ecb8e"};

        let MATPRICES={};
        async function loadMat(){ MATPRICES={}; try{ if(await adapter.exists(MAT_PATH)){ const p=JSON.parse(await adapter.read(MAT_PATH)); if(p&&p.prices){ Object.keys(p.prices).forEach(k=>{ MATPRICES[k]=Number(p.prices[k].gold)||0; }); } } }catch(e){} }
        function price(name){ return MATPRICES[nk(name)]||0; }

        const CONC_PATH=(folder?folder+"/":"")+"MIDNIGHT_Concentracao_Data.json";
        const PROFLABEL="Alquimia";
        const KGROUP={pot:"Poção",phial:"Phial",flask:"Flask"};
        const CONC_DEF0={"Poção":20,"Phial":35,"Flask":50,"Gema":40,"Encantamento":40,"Inscrição":35,"Ferraria":70,"Engenharia":55};
        let CONC={def:Object.assign({},CONC_DEF0),item:{}};
        async function loadConc(){try{if(await adapter.exists(CONC_PATH)){const p=JSON.parse(await adapter.read(CONC_PATH));CONC={def:Object.assign({},CONC_DEF0,(p&&p.def)||{}),item:(p&&p.item&&typeof p.item==="object")?p.item:{}};}else{CONC={def:Object.assign({},CONC_DEF0),item:{}};}}catch(e){CONC={def:Object.assign({},CONC_DEF0),item:{}};}}
        let _cSaving=false,_cPending=false;
        async function saveConc(){if(_cSaving){_cPending=true;return;}_cSaving=true;try{await adapter.write(CONC_PATH,JSON.stringify(CONC));}catch(e){}_cSaving=false;if(_cPending){_cPending=false;saveConc();}}
        function concKeyOf(name){return PROFLABEL+"|"+nk(name);}
        function concOf(name,group){const k=concKeyOf(name);if(CONC.item[k]!=null)return Number(CONC.item[k])||0;return Number(CONC.def[group]||0)||0;}

        function freshState(){ return { res:31, mc:34, cut:5, ah:{}, sort:"profit" }; }
        async function loadState(){ try{ if(await adapter.exists(DATA_PATH)){ const p=JSON.parse(await adapter.read(DATA_PATH)); const s=freshState(); if(typeof p.res==="number")s.res=p.res; if(typeof p.mc==="number")s.mc=p.mc; if(typeof p.cut==="number")s.cut=p.cut; if(p.ah&&typeof p.ah==="object")s.ah=p.ah; if(["profit","roi","cost","value","ah","name","grp"].includes(p.sort))s.sort=p.sort; return s; } }catch(e){} return freshState(); }
        let saving=false,pending=false;
        async function saveState(){ if(saving){pending=true;return;} saving=true; try{ await adapter.write(DATA_PATH,JSON.stringify(S)); }catch(e){} saving=false; if(pending){pending=false;saveState();} }
        let S = await loadState();
        await loadMat();
        await loadConc();

        function calc(r){
          const [grp,kind,name,mats]=r; const K=KIND[kind];
          let raw=0, missing=[]; mats.forEach(([q,m])=>{ const p=price(m); if(p<=0)missing.push(m); raw+=q*p; });
          raw+=K.flat;
          const cost = raw * (1 - (S.res/100)*0.3);
          const ahOv = S.ah[nk(name)];
          const ahImp = price(name);
          const ah = (ahOv!=null)?ahOv : ahImp;
          const fromImport = (ahOv==null && ahImp>0);
          const mult = 1 + (S.mc/100)*K.mbase;
          const value = ah * K.yield * mult * (1 - S.cut/100);
          const profit = value - cost;
          const roi = cost>0 ? profit/cost*100 : 0;
          const recipe = mats.map(([q,m])=>q+"× "+m).join(" + ")+" + "+K.flat+" (base)";
          const cgroup=KGROUP[kind]||grp; const conc=concOf(name,cgroup); const lconc=conc>0?profit/conc:null;
          return {grp,kind,name,mats,cost,ah,fromImport,value,profit,roi,missing,recipe,yield:K.yield,noAh:(ah<=0),cgroup,conc,lconc};
        }
        function allRows(){ return REC.map(calc); }

        root.innerHTML = `<style>

        let searchTerm="", grpFilter="";
        const SORTMAP={profit:"profit",roi:"roi",cost:"cost",value:"value",ah:"ah",name:"name",grp:"grp",lconc:"lconc"};
        function render(){
          if($("#p-res")&&document.activeElement!==$("#p-res"))$("#p-res").value=S.res;
          if($("#p-mc")&&document.activeElement!==$("#p-mc"))$("#p-mc").value=S.mc;
          if($("#p-cut")&&document.activeElement!==$("#p-cut"))$("#p-cut").value=S.cut;
          let rows=allRows();
          const all=rows.slice();
          if(searchTerm){ const t=nk(searchTerm); rows=rows.filter(r=>nk(r.name).includes(t)); }
          if(grpFilter){ rows=rows.filter(r=>r.grp===grpFilter); }
          const sk=SORTMAP[S.sort]||"profit";
          if(sk==="lconc")rows=rows.filter(r=>r.lconc!=null && !r.noAh);
          rows.sort((a,b)=>{ if(sk==="name"||sk==="grp")return String(a[sk]).localeCompare(String(b[sk])); return (b[sk]||0)-(a[sk]||0); });
          
          const withAh=all.filter(r=>!r.noAh);
          const bestP=withAh.slice().sort((a,b)=>b.profit-a.profit)[0];
          const bestR=withAh.slice().sort((a,b)=>b.roi-a.roi)[0];
          const avgP=withAh.length?withAh.reduce((a,r)=>a+r.profit,0)/withAh.length:0;
          $("#a-k1").innerHTML=bestP?('<span style="font-size:12.5px">'+esc(bestP.name.replace(/ Tier 2$/,""))+'</span><br>'+fmtK(bestP.profit)):"—";
          $("#a-k2").innerHTML=bestR?('<span style="font-size:12.5px">'+esc(bestR.name.replace(/ Tier 2$/,""))+'</span><br>'+fmtN(bestR.roi)+"%"):"—";
          $("#a-k3").textContent=withAh.length+"/"+all.length;
          $("#a-k4").textContent=withAh.length?fmtK(avgP):"—";
          root.querySelectorAll("th[data-s]").forEach(th=>th.classList.toggle("sorted",th.dataset.s===S.sort));
          
          const body=$("#a-body");
          body.innerHTML=rows.map(r=>{ const col=GRP_COLOR[r.grp]||"#888"; const key=nk(r.name);

              '<td><input class="cell" data-ah="'+key+'" value="'+(r.ah>0?fmtN(r.ah):"")+'" placeholder="—">'+(r.fromImport?'<span class="imp">⟳</span>':'')+'</td>'+
              '<td class="pf '+(r.profit>=0?"pos":"neg")+'">'+(r.noAh?'<span style="color:var(--muted2)">—</span>':fmtK(r.profit))+'</td>'+
              '<td class="'+(r.roi>=0?"pos":"neg")+'">'+(r.noAh?'<span style="color:var(--muted2)">—</span>':fmtN(r.roi)+"%")+'</td>'+
              '<td><input class="cell cc'+(CONC.item[concKeyOf(r.name)]!=null?" ov":"")+'" data-cc="'+esc(concKeyOf(r.name))+'" value="'+(r.conc>0?r.conc:"")+'" placeholder="'+(CONC.def[r.cgroup]||"—")+'" title="Concentração deste craft (vazio = padrão do tipo '+esc(r.cgroup)+')"></td>'+
              '<td class="pf '+((r.lconc==null)?"":(r.lconc>=0?"pos":"neg"))+'">'+(r.noAh||r.lconc==null?'<span style="color:var(--muted2)">—</span>':fmtK(r.lconc))+'</td></tr>';
          }).join("");
          
          body.querySelectorAll("input[data-ah]").forEach(inp=>inp.onchange=async()=>{ const key=inp.dataset.ah, v=parseNum(inp.value), imp=MATPRICES[key]||0;
            if(isNaN(v)){ delete S.ah[key]; } else if(imp>0 && Math.abs(v-imp)<0.05){ delete S.ah[key]; } else { S.ah[key]=v; }
            await saveState(); render(); });

        .eng-wrap .pos{color:var(--green)} .eng-wrap .neg{color:var(--red)}
        .eng-wrap .pf{font-weight:700}
        .eng-wrap .warn{color:var(--red);font-size:9px;margin-left:5px;cursor:help}
        .eng-wrap .ftr{text-align:center;color:var(--muted2);font-size:11px;margin-top:10px}
        .eng-wrap .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:.25s;pointer-events:none;z-index:9999}
        .eng-wrap .toast.show{opacity:1}
        .eng-wrap button{cursor:pointer;border:none;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;color:#0b0f18;background:linear-gradient(180deg,var(--gold),#b8973a)}
        .eng-wrap button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);font-weight:500}
        @media (max-width:620px){.eng-wrap .stats{grid-template-columns:repeat(2,1fr)}}
        </style>
        <div class="eng-wrap">
          <div class="card" style="margin-bottom:18px">
            <h2 class="mt"><span>⚙️ Parâmetros</span><button class="ghost" id="eng-refresh">↻ atualizar preços (Materiais)</button></h2>
            <div class="params">
              <div class="param"><label>Resourcefulness %</label><input type="number" id="eng-res" step="0.1"></div>
              <div class="param" id="eng-mcwrap"><label>Multicraft %</label><input type="number" id="eng-mc" step="0.1"></div>
              <div class="param"><label>Taxa de AH %</label><input type="number" id="eng-cut" step="0.5"></div>
            </div>
            <div style="font-size:11.5px;color:var(--muted2)" id="eng-note"></div>
          </div>
          <div class="stats">
            <div class="stat"><div class="n" id="eng-k1">—</div><div class="l">Maior lucro/item</div></div>
            <div class="stat"><div class="n" id="eng-k2">—</div><div class="l">Maior ROI%</div></div>
            <div class="stat"><div class="n" id="eng-k3">0</div><div class="l">Com preço AH</div></div>
            <div class="stat"><div class="n" id="eng-k4">—</div><div class="l">Lucro/item médio</div></div>
          </div>
          <div class="card">
            <h2 class="mt"><span>🧮 Crafts</span><button class="ghost" id="eng-reset">padrão</button></h2>
            <div class="toolbar"><input type="text" id="eng-search" placeholder="🔎 Buscar craft…"></div>
            <div class="tw"><table><thead><tr>
              <th data-s="name">Craft</th><th data-s="cost">Custo</th><th>Breakeven</th><th data-s="ah">Preço AH</th><th data-s="profit">Lucro/item</th><th data-s="roi">ROI%</th><th>Conc</th><th data-s="lconc">Lucro/Conc</th>
            </tr></thead><tbody id="eng-body"></tbody></table></div>
          </div>
          <div class="ftr">Preço AH ⟳ = do painel Materiais (editável) · ⚠ = falta preço de material · receitas/fórmulas da Kaychak · dados em <b>MIDNIGHT_Engenharia_Data.json</b></div>
        </div>`;

        let toastT=null;
        function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";root.querySelector(".eng-wrap").appendChild(t);}t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2000);}

        let searchTerm="";
        const SORTMAP={profit:"profit",roi:"roi",cost:"cost",ah:"ah",name:"n",lconc:"lconc"};
        function render(){
          if($("#eng-res")&&document.activeElement!==$("#eng-res"))$("#eng-res").value=S.res;
          if($("#eng-mc")&&document.activeElement!==$("#eng-mc"))$("#eng-mc").value=S.mc;
          if($("#eng-cut")&&document.activeElement!==$("#eng-cut"))$("#eng-cut").value=S.cut;
          if($("#eng-mcwrap"))$("#eng-mcwrap").style.display=HAS_A?"":"none";
          $("#eng-note").innerHTML = HAS_A
            ? "Custo = (Σ mats × preço) × (1 − res%×"+META.resF+") · Valor/craft = AH × rendimento × (1 + mc%×base) × (1 − taxa)."
            : "Custo = (Σ mats × preço) × (1 − res%×"+META.resF+") · Lucro = preço AH − custo/(1 − taxa). (multicraft não entra no valor desta profissão)";
          let rs=rows(); const all=rs.slice();
          if(searchTerm){const t=nk(searchTerm);rs=rs.filter(r=>nk(r.n).includes(t));}
          const sk=SORTMAP[S.sort]||"profit";
          if(sk==="lconc")rs=rs.filter(r=>r.lconc!=null && !r.noAh && !r.nr);
          rs.sort((a,b)=>{if(sk==="n")return String(a.n).localeCompare(String(b.n));return (b[sk]||0)-(a[sk]||0);});
          const withAh=all.filter(r=>!r.noAh && !r.nr);
          const bp=withAh.slice().sort((a,b)=>b.profit-a.profit)[0], br=withAh.slice().sort((a,b)=>b.roi-a.roi)[0];
          const avg=withAh.length?withAh.reduce((a,r)=>a+r.profit,0)/withAh.length:0;
          $("#eng-k1").innerHTML=bp?('<span style="font-size:12px">'+esc(bp.n.replace(/ Tier [12]$/,""))+'</span><br>'+fmtK(bp.profit)):"—";
          $("#eng-k2").innerHTML=br?('<span style="font-size:12px">'+esc(br.n.replace(/ Tier [12]$/,""))+'</span><br>'+fmtN(br.roi)+"%"):"—";
          $("#eng-k3").textContent=withAh.length+"/"+all.length;
          $("#eng-k4").textContent=withAh.length?fmtK(avg):"—";
          root.querySelectorAll("th[data-s]").forEach(th=>th.classList.toggle("sorted",th.dataset.s===S.sort));
          const body=$("#eng-body");
          body.innerHTML=rs.map(r=>{const key=nk(r.n);
            const warn=r.nr?'<span class="warn" title="Receita não detectada no .xlsx — custo pode estar incompleto">⚠</span>':(r.miss.length?'<span class="warn" title="Sem preço: '+esc(r.miss.join(", "))+'">⚠</span>':'');
            return '<tr data-k="'+key+'">'+
              '<td class="name" title="'+esc(r.recipe)+'">'+esc(r.n.replace(/ Tier ([12])$/," T$1"))+warn+'</td>'+
              '<td>'+fmtK(r.cost)+'</td>'+
              '<td>'+(r.noAh&&r.m==="A"?'<span style="color:var(--muted2)">—</span>':fmtK(r.value))+'</td>'+
              '<td><input class="cell" data-ah="'+key+'" value="'+(r.ah>0?fmtN(r.ah):"")+'" placeholder="—">'+(r.fromImp?'<span class="imp">⟳</span>':'')+'</td>'+
              '<td class="pf '+(r.profit>=0?"pos":"neg")+'">'+(r.noAh?'<span style="color:var(--muted2)">—</span>':fmtK(r.profit))+'</td>'+
              '<td class="'+(r.roi>=0?"pos":"neg")+'">'+(r.noAh?'<span style="color:var(--muted2)">—</span>':fmtN(r.roi)+"%")+'</td>'+
              '<td><input class="cell cc'+(CONC.item[concKeyOf(r.n)]!=null?" ov":"")+'" data-cc="'+esc(concKeyOf(r.n))+'" value="'+(r.conc>0?r.conc:"")+'" placeholder="'+(CONC.def[CGROUP]||"—")+'" title="Concentração deste craft (vazio = padrão do tipo '+esc(CGROUP)+')"></td>'+
              '<td class="pf '+((r.lconc==null)?"":(r.lconc>=0?"pos":"neg"))+'">'+(r.noAh||r.lconc==null?'<span style="color:var(--muted2)">—</span>':fmtK(r.lconc))+'</td></tr>';
          }).join("");
          body.querySelectorAll("input[data-ah]").forEach(inp=>inp.onchange=async()=>{const key=inp.dataset.ah,vv=parseNum(inp.value),imp=MAT[key]||0;if(isNaN(vv)){delete S.ah[key];}else if(imp>0&&Math.abs(vv-imp)<0.05){delete S.ah[key];}else{S.ah[key]=vv;}await saveState();render();});
          body.querySelectorAll("input[data-cc]").forEach(inp=>inp.onchange=async()=>{const k=inp.dataset.cc,vv=parseNum(inp.value);if(isNaN(vv)||inp.value.trim()===""){delete CONC.item[k];}else{CONC.item[k]=vv;}await saveConc();render();});
        }

        async function setP(f,v){if(isNaN(v))return;S[f]=v;await saveState();render();}
        $("#eng-res").onchange=e=>setP("res",parseNum(e.target.value));
        $("#eng-mc").onchange=e=>setP("mc",parseNum(e.target.value));
        $("#eng-cut").onchange=e=>setP("cut",parseNum(e.target.value));
        root.querySelectorAll("th[data-s]").forEach(th=>th.onclick=async()=>{S.sort=th.dataset.s;await saveState();render();});
        $("#eng-search").oninput=e=>{searchTerm=e.target.value;render();};
        $("#eng-refresh").onclick=async()=>{await loadMat();render();toast("Preços atualizados");};
        $("#eng-reset").onclick=async()=>{S.res=META.res;S.mc=META.mc;S.cut=5;await saveState();render();toast("Parâmetros padrão");};
        if(window.__pf__engenharia){window.removeEventListener("focus",window.__pf__engenharia);}
        window.__pf__engenharia=async()=>{const el=$("#eng-body");if(!el||!document.body.contains(el))return;if(root.querySelector("input:focus"))return;try{S=await loadState();await loadMat();await loadConc();}catch(e){}render();};
        window.addEventListener("focus",window.__pf__engenharia);
        render();
      }

      const RUN={melhores:run_melhores,materiais:run_materiais,alquimia:run_alquimia,joalheria:run_joalheria,encantamento:run_encantamento,inscricao:run_inscricao,ferraria:run_ferraria,engenharia:run_engenharia};
      const _ran={};
      async function _ensure(k){ if(_ran[k])return; _ran[k]=true; const el=CROOT.querySelector('[data-sec="'+k+'"]'); try{ await RUN[k](el); }catch(e){ _ran[k]=false; console.log('painel '+k+' erro',e); } }

      await _ensure(_active);
      _apply();
      setTimeout(_redraw,300);

    });
  </script>
</body>
</html>
